<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
<title id="t">KeepG rule examples</title><desc id="d">Examples of people, location, time, and expression smart album rules.</desc>
<rect width="1200" height="650" fill="#fafafa"/><text x="70" y="90" font-family="Arial" font-size="40" font-weight="800" fill="#111827">Build smart albums around your life</text>
<g font-family="Arial"><rect x="70" y="135" width="245" height="390" rx="28" fill="#f5f3ff"/><text x="105" y="205" font-size="42">👤</text><text x="105" y="255" font-size="25" font-weight="700" fill="#5b21b6">Person</text><text x="105" y="295" font-size="18" fill="#475569">Name a detected group</text><text x="105" y="325" font-size="18" fill="#475569">and turn it into a rule.</text><text x="105" y="440" font-size="19" font-weight="700" fill="#111827">“Mina”</text><text x="105" y="470" font-size="16" fill="#64748b">87 matches</text>
<rect x="335" y="135" width="245" height="390" rx="28" fill="#ecfeff"/><text x="370" y="205" font-size="42">⌖</text><text x="370" y="255" font-size="25" font-weight="700" fill="#0f766e">Location</text><text x="370" y="295" font-size="18" fill="#475569">Latitude + longitude</text><text x="370" y="325" font-size="18" fill="#475569">with your own radius.</text><text x="370" y="440" font-size="19" font-weight="700" fill="#111827">“Taipei 2 km”</text><text x="370" y="470" font-size="16" fill="#64748b">481 matches</text>
<rect x="600" y="135" width="245" height="390" rx="28" fill="#eff6ff"/><text x="635" y="205" font-size="42">◷</text><text x="635" y="255" font-size="25" font-weight="700" fill="#1d4ed8">Time</text><text x="635" y="295" font-size="18" fill="#475569">Define exact start</text><text x="635" y="325" font-size="18" fill="#475569">and end dates.</text><text x="635" y="440" font-size="19" font-weight="700" fill="#111827">“Summer 2026”</text><text x="635" y="470" font-size="16" fill="#64748b">906 matches</text>
<rect x="865" y="135" width="245" height="390" rx="28" fill="#fff7ed"/><text x="900" y="205" font-size="42">☺</text><text x="900" y="255" font-size="25" font-weight="700" fill="#c2410c">Expression</text><text x="900" y="295" font-size="18" fill="#475569">Smiling, neutral, or</text><text x="900" y="325" font-size="18" fill="#475569">eyes-closed thresholds.</text><text x="900" y="440" font-size="19" font-weight="700" fill="#111827">“Big smiles”</text><text x="900" y="470" font-size="16" fill="#64748b">231 matches</text></g>
<text x="70" y="590" font-family="Arial" font-size="18" fill="#64748b">Rules are local metadata and can be created or deleted without moving original photos.</text>
</svg>
