<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">KeepG Vault demo</title><desc id="d">Concept demo of password, device credential, and encrypted Vault protection.</desc>
<rect width="1200" height="760" fill="#0f172a"/><text x="80" y="110" font-family="Arial" font-size="46" font-weight="800" fill="#f8fafc">Protection has two layers</text>
<g font-family="Arial"><rect x="80" y="160" width="480" height="480" rx="30" fill="#1e293b"/><circle cx="160" cy="240" r="42" fill="#6d28d9"/><text x="160" y="253" text-anchor="middle" font-size="38" fill="#fff">🔒</text><text x="225" y="228" font-size="27" font-weight="700" fill="#fff">KeepG lock</text><text x="225" y="260" font-size="18" fill="#cbd5e1">Hide selected photos or albums</text><text x="120" y="335" font-size="21" fill="#e2e8f0">✓ Device credential / biometric prompt</text><text x="120" y="380" font-size="21" fill="#e2e8f0">✓ PBKDF2 KeepG password</text><text x="120" y="425" font-size="21" fill="#e2e8f0">✓ Session-only unlock state</text><text x="120" y="505" font-size="17" fill="#94a3b8">In-app access control. The original MediaStore file</text><text x="120" y="532" font-size="17" fill="#94a3b8">still exists outside KeepG.</text>
<rect x="640" y="160" width="480" height="480" rx="30" fill="#111827" stroke="#14b8a6" stroke-width="2"/><circle cx="720" cy="240" r="42" fill="#0f766e"/><text x="720" y="253" text-anchor="middle" font-size="38" fill="#fff">◆</text><text x="785" y="228" font-size="27" font-weight="700" fill="#fff">Encrypted Vault</text><text x="785" y="260" font-size="18" fill="#99f6e4">Confidential app-private copy</text><text x="680" y="335" font-size="21" fill="#e2e8f0">✓ AES-GCM authenticated encryption</text><text x="680" y="380" font-size="21" fill="#e2e8f0">✓ Android Keystore non-exportable key</text><text x="680" y="425" font-size="21" fill="#e2e8f0">✓ Android backup exclusions</text><text x="680" y="505" font-size="17" fill="#94a3b8">For full confidentiality, verify the Vault copy and</text><text x="680" y="532" font-size="17" fill="#94a3b8">remove the original through Android system controls.</text></g>
<text x="80" y="705" font-family="Arial" font-size="18" fill="#94a3b8">No Internet permission is required for KeepG classification or Vault encryption.</text>
</svg>
