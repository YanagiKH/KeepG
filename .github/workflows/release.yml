name: Publish verified installers
on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: keepg-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Verify trusted current-main source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$VERIFIED_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Download the exact verified installer bytes
        uses: actions/download-artifact@v4
        with:
          name: keepg-installers
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Validate and publish all assets atomically from a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
