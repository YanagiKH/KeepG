name: Prepare localized UI objects
on:
  push:
    branches: [feature/workspace-agent-0.7]
    paths: [.github/workflows/prepare-ui.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'YanagiKH/KeepG'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate translations and prepare scoped Git objects without moving branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          def post(endpoint, body):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + endpoint, data=json.dumps(body).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(req, timeout=60) as response: return json.load(response)
          root = pathlib.Path('app/src/main/java/com/yanagikh/keepg/ui')
          updates = {}
          path = root / 'MediaPreviewScreen.kt'
          text = path.read_text()
          for label in ('Vault', 'KeepG creates a recovered copy instead of destructively rewriting the original.', 'Preserve date', 'Use current date', 'Reset'):
              old = 'Text("' + label + '")'
              assert text.count(old) == 1, label
              text = text.replace(old, 'Text(tr("' + label + '"))')
          old = 'Column(Modifier.fillMaxSize()) {'
          assert text.count(old) == 1
          text = text.replace(old, 'Column(Modifier.fillMaxSize().safeDrawingPadding().imePadding()) {')
          updates[str(path)] = text
          path = root / 'GalleryScreens.kt'
          text = path.read_text()
          for old, new in [
              ('Text("${collectionItems.count { it.collectionId == collection.id }} items")', 'Text(trf("%s items", collectionItems.count { it.collectionId == collection.id }))'),
              ('Text("${group.size} items${if (locked) " · ${tr("Protected")}" else ""}")', 'Text(trf("%s items", group.size) + if (locked) " · ${tr("Protected")}" else "")')
          ]:
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          updates[str(path)] = text
          for path, text in updates.items(): pathlib.Path(path).write_text(text)
          subprocess.run(['python3', '-m', 'unittest', 'discover', '-s', 'scripts/tests', '-v'], check=True)
          entries = []
          for path, text in updates.items():
              blob = post('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(text.encode()).decode()})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          tree = post('/git/trees', {'base_tree': base, 'tree': entries})
          result = {'base_commit': os.environ['GITHUB_SHA'], 'tree': tree['sha'], 'entries': entries}
          pathlib.Path('prepared-tree.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-localization-tree
          path: prepared-tree.json
          if-no-files-found: error
